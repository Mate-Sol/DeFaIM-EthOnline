# =====================================================================
#  Build the three service images, scan them, and roll out to GKE.
#
#  Reuses the Arc hackathon stack as-is: same beta cluster, same
#  arc-hackathon namespace, same image and deployment names, same
#  hostnames. Nothing new to provision — devops only adds this repo's
#  four secrets.
#
#      matesol/arc-be     <- server/            -> deployment arc-be
#      matesol/arc-ui     <- web/lender/        -> deployment arc-ui
#      matesol/arc-admin  <- web/portal/        -> deployment arc-admin
#
#  Tests run in ci.yml and are not repeated here.
# =====================================================================

name: Deploy

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

on:
  push:
    branches: ["beta"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  # Beta cluster — NEVER prod (im-prod). Hackathon stacks deploy to beta only.
  GKE_CLUSTER: beta-env
  GKE_ZONE: us-central1-a
  NAMESPACE: arc-hackathon
  CI: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: matesol/arc-be
            context: ./server
          - image: matesol/arc-ui
            context: ./web/lender
          - image: matesol/arc-admin
            context: ./web/portal

    steps:
      - uses: actions/checkout@v4

      # The frontend images build a Vite bundle; the runner's default disk
      # does not leave much headroom once three of these run.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /opt/hostedtoolcache/*
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_UNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          no-cache: true
          tags: ${{ matrix.image }}:main

  scan:
    name: Scan images
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [matesol/arc-be, matesol/arc-ui, matesol/arc-admin]

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_UNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull image
        run: docker pull ${{ matrix.image }}:main

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ matrix.image }}:main
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

  rollout:
    name: Roll out
    runs-on: ubuntu-latest
    needs: scan
    strategy:
      fail-fast: false
      matrix:
        deployment: [arc-be, arc-ui, arc-admin]

    steps:
      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.BETA_GKE_WIF_PROVIDER }}
          service_account: ${{ secrets.BETA_GKE_GKE_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Restart deployment
        run: kubectl rollout restart deployment/${{ matrix.deployment }} --namespace ${{ env.NAMESPACE }}

      - name: Check rollout status
        run: kubectl rollout status deployment/${{ matrix.deployment }} --namespace ${{ env.NAMESPACE }} --timeout=180s
